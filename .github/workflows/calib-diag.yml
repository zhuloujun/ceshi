# 诊断用：查看线上叠加的"标注校准"和服务器上保存的标注数量（不打印标注原文）。只能手动运行。
name: 校准诊断

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 查询
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.HF_ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          import hmac as _h, hashlib as _hl  # 检测服务地址保密、只接受本站转发：地址和通行证都由管理员密码算出
          _at = os.environ.get("ADMIN_TOKEN", "").encode()
          _lab = "atc-" + _h.new(_at, b"ai-text-checker/modal-label/v1", _hl.sha256).hexdigest()[:20]
          print("::add-mask::" + _lab, flush=True)
          BASE = "https://zhuloujun--" + _lab + ".modal.run"
          _o = urllib.request.build_opener(); _o.addheaders = [("X-ATC-Proxy", _h.new(_at, b"ai-text-checker/worker-proxy/v1", _hl.sha256).hexdigest())]
          urllib.request.install_opener(_o)
          H = {"X-Admin-Token": os.environ["ADMIN_TOKEN"]}
          for path in ("/admin/api/labels", "/admin/api/calibration"):
              with urllib.request.urlopen(urllib.request.Request(BASE + path, headers=H), timeout=600) as r:
                  d = json.loads(r.read())
              print(f"::notice title={path}::" + json.dumps(d, ensure_ascii=False)[:3800], flush=True)
          PY
