# 训练"英文第二分类器"（专门识别国产大模型写的英文），发布到本仓库 Release。
# 训练在 Modal 的 GPU 上进行（server/tools/train_english_modal.py；需要 MODAL_TOKEN_ID / MODAL_TOKEN_SECRET），
# 没有 Modal 密钥时退回 GitHub 的 CPU（数据量大时很慢）。在 Actions 页面手动运行。
name: 训练英文检测模型

on:
  workflow_dispatch:
    inputs:
      args:
        description: "传给 train_english.py 的额外参数（可留空）"
        default: ""
      backend:
        description: "在哪里训练：kaggle（免费 GPU，默认）/ modal（付费额度）/ actions（GitHub 免费 CPU，从 base_tag 那版接着训练，限时）"
        default: "kaggle"
      tag:
        description: "发布到哪个 Release（默认 english-classifier-v3；对比实验用别的名字）"
        default: "english-classifier-v3"
      user_docs:
        description: "（自动填写）用户提供的已标注英文，加密传入，不进公开仓库"
        default: ""
      base_tag:
        description: "actions 后端：从哪一版接着训练（如 english-classifier-v14）"
        default: ""

permissions:
  contents: write

concurrency:
  group: train-english
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || 'english-classifier-v3' }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "modal==1.5.5" "kaggle>=2.0"
      - name: 在 GPU 上训练（Kaggle 免费 / Modal）
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ls server/tools/data/gen_en || { echo "::error::还没有生成数据"; exit 1; }
          if [ "${{ github.event.inputs.backend || 'kaggle' }}" = "actions" ]; then
            # GitHub 免费 CPU（4 核）：从已训练好的版本接着训练，限时 200 分钟（到点保存开发集上最好的一版）。
            # 2026-10 Kaggle 账号被封、等待申诉期间使用。
            pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
            pip install -r server/requirements.txt "datasets>=2.19" huggingface_hub
            gh release download "${{ github.event.inputs.base_tag }}" -p english-classifier.tar.gz -D /tmp/base -R "${{ github.repository }}"
            mkdir -p /tmp/basex && tar xzf /tmp/base/english-classifier.tar.gz -C /tmp/basex
            python - <<'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download("yaful/MAGE", "valid.csv", repo_type="dataset", local_dir="/tmp/mage")
          PY
            UD=""
            EXTRA=$(jq -r '.inputs.user_docs // ""' "$GITHUB_EVENT_PATH")   # 从事件文件读取，先屏蔽密钥
            if [ -n "$EXTRA" ]; then
              KEY="${EXTRA##*#}"; URL="${EXTRA%#*}"; URL="${URL#enc:}"
              echo "::add-mask::$KEY"
              curl -sSL -o /tmp/ud.enc "$URL"; printf '%s' "$KEY" > /tmp/ud.key
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/ud.key -in /tmp/ud.enc | xz -d > /tmp/user_docs.jsonl
              rm -f /tmp/ud.key /tmp/ud.enc; UD="--user-docs /tmp/user_docs.jsonl"
            fi
            cd server && TORCH_THREADS=4 python -u tools/train_english.py --mage-dir /tmp/mage --out /tmp/english-classifier \
              --base /tmp/basex/english-classifier --lr 1e-5 --time-budget-min 200 $UD ${{ github.event.inputs.args }}
            cd .. && tar czf english-classifier.tar.gz -C /tmp english-classifier
          elif [ "${{ github.event.inputs.backend || 'kaggle' }}" = "modal" ]; then
            modal run server/tools/train_english_modal.py --args "${{ github.event.inputs.args }}"
          else
            python -u server/tools/kaggle_train.py --lang en --sha "$GITHUB_SHA" --args "${{ github.event.inputs.args }}"
          fi
          mkdir -p /tmp/x && tar xzf english-classifier.tar.gz -C /tmp/x
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/x/english-classifier/training_result.json"))
          for k in ("1pct", "5pct"):
              print(f"::notice title=英文第二分类器评估（误判率 {k}）::" + json.dumps(
                  {"auroc": r["test_auroc_all"], "ai_caught": r[f"ai_caught_at_{k}"], "human_flagged": r[f"human_flagged_at_{k}"], "user_docs": r.get(f"user_docs_flagged_at_{k}")},
                  ensure_ascii=False))
          PY
          cat /tmp/x/english-classifier/training_result.json >> "$GITHUB_STEP_SUMMARY"
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "英文 AI 检测模型（国产大模型英文）" \
              --notes "由 server/tools/train_english.py 训练：arXiv / PubMed（含中国作者）/ MAGE 真人英文 vs DeepSeek、Kimi、文心一言等生成的英文论文。"
          gh release upload "$RELEASE_TAG" english-classifier.tar.gz --clobber
