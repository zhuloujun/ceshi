# 一次性：重写历史后删除旧的实验分支（它们仍指向含明文语料的旧提交）
name: 删除旧实验分支（一次性）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 删除
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0; bad=0
          while read b; do
            case "$b" in ""|main|data-1020|exp-p50g) continue;; esac
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" 2>/tmp/e; then ok=$((ok+1)); else bad=$((bad+1)); echo "::warning title=$b::$(head -c 150 /tmp/e)"; fi
          done < .github/retag/del_branches.txt
          echo "::notice title=删除分支::成功 $ok，失败 $bad"
