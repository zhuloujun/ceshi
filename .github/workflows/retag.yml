# 一次性：重写历史（清除明文语料）后，把发布用的标签指向重写后的对应提交（本工作区的代理不允许直接推送标签）
name: 标签改指向重写后的提交（一次性）
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只处理这些标签（空格分隔；留空 = 全部）"
        default: ""
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 更新标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0; bad=0
          while read t s; do
            [ -z "$t" ] && continue
            if [ -n "${{ github.event.inputs.only }}" ] && ! echo " ${{ github.event.inputs.only }} " | grep -q " $t "; then continue; fi
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" 2>/tmp/e && gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$t" -f sha="$s" >/dev/null 2>>/tmp/e; then ok=$((ok+1))
            else bad=$((bad+1)); echo "::warning title=$t::$(head -c 200 /tmp/e)"; fi
          done < .github/retag/map.txt
          echo "::notice title=标签::已更新 $ok 个，失败 $bad 个"
          # 删除标签会让对应的 Release 变成草稿：按名称找回草稿，重新挂到新标签并发布
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate -q '.[]|select(.draft)|"\(.id) \(.tag_name)"' > /tmp/drafts || true
          while read id t; do
            grep -q "^$t " .github/retag/map.txt || continue
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" -f tag_name="$t" -F draft=false >/dev/null && echo "republished $t" || { bad=$((bad+1)); echo "::warning title=release $t::republish failed"; }
          done < /tmp/drafts
          echo "::notice title=发布::草稿 $(wc -l < /tmp/drafts) 个，失败累计 $bad"
          [ "$bad" = 0 ]
