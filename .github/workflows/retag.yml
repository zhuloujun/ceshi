# 一次性：重写历史（清除明文语料）后，把发布用的标签指向重写后的对应提交（本工作区的代理不允许直接推送标签）
name: 标签改指向重写后的提交（一次性）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 更新标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0; bad=0
          while read t s; do
            [ -z "$t" ] && continue
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" -f sha="$s" -F force=true >/dev/null 2>/tmp/e; then ok=$((ok+1))
            else bad=$((bad+1)); echo "::warning title=$t::$(head -c 200 /tmp/e)"; fi
          done < .github/retag/map.txt
          echo "::notice title=标签::已更新 $ok 个，失败 $bad 个"
          [ "$bad" = 0 ]
