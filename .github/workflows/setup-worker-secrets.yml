# 把网站（Cloudflare Worker）需要的密钥写进它自己的 D1 数据库：
#   KEY_SIGNING_SECRET  由 GitHub Secrets 里的管理员密码（ADMIN_TOKEN / HF_ADMIN_TOKEN）算出，和检测服务签发 Key 的方式一致
#   RESEND_API_KEY      发验证码邮件（GitHub Secrets 里有 RESEND_API_KEY 时才写）
# 需要一个一次性的"设置令牌"（由维护者事先在 D1 里登记，30 分钟内有效），令牌和密钥都不会出现在日志里。
name: 写入网站密钥

on:
  workflow_dispatch:
    inputs:
      token:
        description: "一次性设置令牌（由维护者提供）"
        required: true
      site:
        description: "网站地址"
        default: "https://ai-text-checker.agi001.workers.dev"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 写入
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.HF_ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          inp = ev.get("inputs") or {}
          tok, site = inp.get("token", ""), (inp.get("site") or "").rstrip("/")
          print("::add-mask::" + tok, flush=True)
          sec = {}
          if os.environ.get("ADMIN_TOKEN"):
              at = os.environ["ADMIN_TOKEN"].encode()
              sec["KEY_SIGNING_SECRET"] = hmac.new(at, b"ai-text-checker/key-secret/v1", hashlib.sha256).hexdigest()
              # 检测服务的保密地址和"只接受本站转发"的通行证（与部署工作流 deploy-server.yml 的算法一致）
              label = "atc-" + hmac.new(at, b"ai-text-checker/modal-label/v1", hashlib.sha256).hexdigest()[:20]
              print("::add-mask::" + label, flush=True)
              sec["BACKEND_URL"] = f"https://{os.environ.get('MODAL_USER') or 'zhuloujun'}--{label}.modal.run"
              sec["BACKEND_PROXY_SECRET"] = hmac.new(at, b"ai-text-checker/worker-proxy/v1", hashlib.sha256).hexdigest()
              print("::add-mask::" + sec["BACKEND_PROXY_SECRET"], flush=True)
          else:
              print("::error::GitHub Secrets 里没有 ADMIN_TOKEN / HF_ADMIN_TOKEN")
          for k in ("RESEND_API_KEY", "TURNSTILE_SECRET_KEY"):
              if os.environ.get(k, "").strip():
                  sec[k] = os.environ[k].strip()
          req = urllib.request.Request(site + "/api/setup/secret", json.dumps({"token": tok, "secrets": sec}).encode(),
                                       {"Content-Type": "application/json", "User-Agent": "setup-worker-secrets"})
          try:
              r = json.loads(urllib.request.urlopen(req, timeout=60).read())
          except Exception as e:
              raise SystemExit(f"::error::写入失败：{e}")
          print("::notice title=已写入网站密钥::" + "、".join(r.get("written") or []) + "（GitHub Secrets 里有的：" + "、".join(sorted(sec)) + "）")
          if r.get("test_email"):
              print(("::notice title=测试邮件::已发到管理员邮箱" if r["test_email"] == "sent" else "::error title=测试邮件发送失败::" + r["test_email"]), flush=True)
          if not r.get("ok"):
              raise SystemExit("::error::网站拒绝了写入（设置令牌不对或已过期）")
          PY
