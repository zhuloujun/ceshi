# 线上验收：用仓库里确认过来源的样本（server/tools/data/eval_en_user_docs.jsonl 等）请求线上服务，打印每篇 / 每段的结果。
# 只能在 Actions 页面手动运行。会签发一个 1 天有效的临时 Key。
name: 线上验收检测

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 请求线上服务
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.HF_ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          BASE = "https://zhuloujun--ai-text-checker-web.modal.run"
          def call(path, body=None, headers=None, method=None):
              req = urllib.request.Request(BASE + path, json.dumps(body).encode() if body is not None else None,
                                           {"Content-Type": "application/json", **(headers or {})}, method=method)
              with urllib.request.urlopen(req, timeout=900) as r:
                  return json.loads(r.read())
          key = call("/admin/api/keys", {"name": "live-check", "days": 1}, {"X-Admin-Token": os.environ["ADMIN_TOKEN"]})
          tok = key.get("key") or key.get("api_key") or key.get("token")
          rows = [json.loads(l) for f in ("server/tools/data/eval_en_user_docs.jsonl", "server/tools/data/eval_zh_user_docs.jsonl")
                  for l in open(f, encoding="utf-8") if l.strip()]
          summary = []
          problems = []
          docs = {}
          for r in rows:
              docs.setdefault((r["doc"], r["y"]), []).append(r["text"])
          for (doc, y), paras in docs.items():
            for sep in ("\n\n", "\n"):
              j = call("/v1/detect", {"text": sep.join(paras), "wait": True}, {"Authorization": "Bearer " + tok})
              while j.get("status") not in ("done", "error"):
                  time.sleep(5)
                  j = call(f"/v1/jobs/{j['job_id']}", headers={"Authorization": "Bearer " + tok})
              res = j.get("result") or {}
              s = res.get("summary") or {}
              segs = [f"{round((g.get('prob') or 0) * 100)}%{'*' if g.get('level') in ('high', 'mid', 'light') else ''}"
                      f"(en2 {round((g.get('raw') or {}).get('classifier_en2', -1) * 100)} cls {round((g.get('raw') or {}).get('classifier', -1) * 100)} thr {round(g.get('threshold', 0) * 100)} {g.get('chars')})"
                      for g in res.get("segments", []) if g.get("prob") is not None]
              summary.append(f"{doc}（{'AI' if y else '真人'}，{'空行' if sep == chr(10) * 2 else '换行'}）AI 率 {s.get('ai_rate')}")
              print(f"::notice title={doc}（{'AI' if y else '真人'}）{'空行分段' if sep == chr(10) * 2 else '换行分段'}::AI 率 {s.get('ai_rate')} · 各段 {' '.join(segs)}")
              if sep == "\n\n" and ((y == 0 and (s.get("ai_rate") or 0) > 0) or (y == 1 and (s.get("ai_rate") or 0) < 0.5)):
                  problems.append(doc + "：" + " | ".join(
                      f"{g.get('label') or g.get('kind')} p{round((g.get('prob') or g.get('ref_prob') or 0) * 100)} "
                      f"cls{round((g.get('raw') or {}).get('classifier', -1) * 100)} en2{round((g.get('raw') or {}).get('classifier_en2', -1) * 100)} "
                      f"ppl{round(2.718 ** (g.get('raw') or {}).get('ppl', 0), 1)} bu{round((g.get('raw') or {}).get('lp_burstiness') or 0, 2)} n{g.get('chars')} 「{g['text'][:12].replace(chr(10), ' ')}」"
                      for g in res.get("segments", [])))
              if doc.startswith("Scallion"):
                  print("::notice title=段落详情::" + json.dumps([{"t": g["text"][:60], "e": g["text"][-40:], "raw": g.get("raw"), "reg": g.get("register")}
                                    for g in res.get("segments", [])], ensure_ascii=False)[:6000])
          # 混排验收：把所有文档（AI 与真人交替）拼成一个文件检测，检查分篇是否正确、真人作品有没有被旁边的 AI 文章"带上"
          order = sorted(docs.items(), key=lambda kv: kv[0][1])
          ai_docs = [kv for kv in order if kv[0][1] == 1]
          hu_docs = [kv for kv in order if kv[0][1] == 0]
          mixed_list = []
          for i in range(max(len(ai_docs), len(hu_docs))):
              if i < len(ai_docs): mixed_list.append(ai_docs[i])
              if i < len(hu_docs): mixed_list.append(hu_docs[i])
          parts, ranges, pos = [], [], 0
          for n_doc, ((doc, y), paras) in enumerate(mixed_list, 1):
              zh_doc = sum(len(p) for p in paras if any("\u4e00" <= ch <= "\u9fff" for ch in p[:200])) * 2 > sum(len(p) for p in paras)
              t = (f"第{n_doc}篇" if zh_doc else f"Work {n_doc}: Text") + "\n" + "\n".join(paras)   # 像真实文集一样，每篇前有篇号
              ranges.append((pos, pos + len(t), doc, y))
              parts.append(t)
              pos += len(t) + 3
          mixed = "\n\n\n".join(parts)
          j = call("/v1/detect", {"text": mixed, "wait": True}, {"Authorization": "Bearer " + tok})
          while j.get("status") not in ("done", "error"):
              time.sleep(5)
              j = call(f"/v1/jobs/{j['job_id']}", headers={"Authorization": "Bearer " + tok})
          res = j.get("result") or {}
          per, cur = {}, 0
          for g in res.get("segments", []):
              k = mixed.find(g["text"][:60], cur)
              if k < 0:
                  continue
              cur = k + 1
              doc_i = next((r for r in ranges if r[0] <= k < r[1]), None)
              if doc_i is None or g.get("prob") is None:
                  continue
              d = per.setdefault((doc_i[2], doc_i[3]), [0, 0])
              d[0] += g.get("chars") or len(g["text"])
              if g.get("level") in ("high", "mid", "light"):
                  d[1] += g.get("chars") or len(g["text"])
          mixed_bad = [f"{doc}（{'AI' if y else '真人'}）{round(b / a * 100) if a else 0}%" for (doc, y), (a, b) in per.items()
                       if (y == 0 and b > 0) or (y == 1 and a and b / a < 0.5)]
          print("::warning title=混排验收（全部文档拼成一篇）::" + f"{len(per)} 篇，判错 {len(mixed_bad)} 篇：" + (" ； ".join(mixed_bad) or "无"))
          print("::warning title=验收汇总::" + " ； ".join(summary))
          print("::warning title=结果不对的文档::" + (" ；； ".join(problems) or "无")[:12000])
          PY
